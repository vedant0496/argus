[project]
name = "argus-api"
version = "0.1.0"
description = "Public query API and realtime feed for the dashboard"
requires-python = ">=3.12"
dependencies = [
    "argus-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
argus-api = "argus_api.__main__:main"

[tool.uv.sources]
argus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_api"]
