[project]
name = "argus-rca-agent"
version = "0.1.0"
description = "LLM-powered root-cause analysis agent with retrieval over runbooks"
requires-python = ">=3.12"
dependencies = [
    "argus-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
argus-rca-agent = "argus_rca_agent.__main__:main"

[tool.uv.sources]
argus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_rca_agent"]
