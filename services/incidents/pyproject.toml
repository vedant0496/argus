[project]
name = "argus-incidents"
version = "0.1.0"
description = "Correlates anomalies and events into incidents"
requires-python = ">=3.12"
dependencies = ["argus-common"]

[project.scripts]
argus-incidents = "argus_incidents.__main__:main"

[tool.uv.sources]
argus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_incidents"]
