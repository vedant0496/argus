[project]
name = "argus-ingestion"
version = "0.1.0"
description = "Telemetry ingestion gateway: validates and publishes metrics, logs and events to the stream"
requires-python = ">=3.12"
dependencies = [
    "argus-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
argus-ingestion = "argus_ingestion.__main__:main"

[tool.uv.sources]
argus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_ingestion"]
