name: Feature
description: A user-facing capability or a technical story for a sprint
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      placeholder: As an on-call engineer, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
